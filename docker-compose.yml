services:
  postgres:
    image: postgres:17-alpine
    container_name: jobnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-cd2_marketplace_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tự động import schema + data lần đầu (khi volume chưa tồn tại)
      - ./02_database/cd2_marketplace_full_dump.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # Migration áp dụng sau dump (idempotent): hồ sơ đăng ký mới + chuẩn hóa loại hình PART_TIME/FULL_TIME
      - ./02_database/migrations/005_registration_redesign_profiles.sql:/docker-entrypoint-initdb.d/02_005.sql:ro
      - ./02_database/migrations/006_normalize_work_type.sql:/docker-entrypoint-initdb.d/03_006.sql:ro
      - ./02_database/migrations/007_file_uploads.sql:/docker-entrypoint-initdb.d/04_007.sql:ro
      - ./02_database/migrations/008_student_profile_details.sql:/docker-entrypoint-initdb.d/05_008.sql:ro
      - ./02_database/migrations/009_student_ward.sql:/docker-entrypoint-initdb.d/06_009.sql:ro
      - ./02_database/migrations/010_avatar_source.sql:/docker-entrypoint-initdb.d/07_010.sql:ro
      - ./02_database/migrations/011_application_snapshot_withdraw.sql:/docker-entrypoint-initdb.d/08_011.sql:ro
      - ./02_database/migrations/012_employer_public_profile.sql:/docker-entrypoint-initdb.d/09_012.sql:ro
      - ./02_database/migrations/013_employer_location.sql:/docker-entrypoint-initdb.d/10_013.sql:ro
      - ./02_database/migrations/014_company_job_reviews.sql:/docker-entrypoint-initdb.d/11_014.sql:ro
      - ./02_database/migrations/015_assignment_status_parttime.sql:/docker-entrypoint-initdb.d/12_015.sql:ro
      - ./02_database/migrations/016_application_withdraw_reason.sql:/docker-entrypoint-initdb.d/13_016.sql:ro
      - ./02_database/migrations/017_employer_company_restructure.sql:/docker-entrypoint-initdb.d/14_017.sql:ro
      - ./02_database/migrations/018_application_status_shortlisted.sql:/docker-entrypoint-initdb.d/15_018.sql:ro
    ports:
      # Chỉ expose ra host để debug bằng psql. Xoá dòng này nếu không cần.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cd2_marketplace_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - jobnest

  backend:
    build:
      context: .
      dockerfile: 03_backend/Dockerfile
    image: jobnest-backend:latest
    container_name: jobnest-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa được đặt trong .env}
      DB_NAME: ${POSTGRES_DB:-cd2_marketplace_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa được đặt trong .env (tối thiểu 32 ký tự)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # CORS: cho phép cả Vite dev (5173, 8081, 8082) và frontend Docker (8080)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082}
      AUTO_BOOTSTRAP: off
    ports:
      - "5000:5000"
    networks:
      - jobnest

  frontend:
    build:
      context: ./04_frontend
      dockerfile: Dockerfile
    image: jobnest-frontend:latest
    container_name: jobnest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - jobnest

volumes:
  postgres_data:

networks:
  jobnest:
    driver: bridge
