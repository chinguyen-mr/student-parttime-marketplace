# ==============================================================================
# UNIFIED DOCKER COMPOSE — JOBNEST + TWENTY CRM REVERSE PROXY GATEWAY
# Usage:
#   docker compose -f infrastructure/docker-compose.unified.yml up -d
# Access:
#   - http://localhost       -> JobNest Web Marketplace
#   - http://localhost/api   -> JobNest Backend API
#   - http://localhost/crm   -> Twenty CRM Management
# ==============================================================================

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: jobnest-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - jobnest
      - twenty-network
    depends_on:
      - jobnest-frontend
      - jobnest-backend

networks:
  jobnest:
    external: true
  twenty-network:
    external: true

