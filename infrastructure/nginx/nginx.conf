# ==============================================================================
# JOBNEST & TWENTY CRM — UNIFIED REVERSE PROXY NGINX CONFIGURATION
# Route mapping:
#   /       -> JobNest Frontend (React SPA)
#   /api/   -> JobNest Backend (Express API)
#   /crm/   -> Twenty CRM Server (Web UI & GraphQL/REST API)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Definitions
    upstream jobnest_frontend {
        server jobnest-frontend:80;
    }

    upstream jobnest_backend {
        server jobnest-backend:5000;
    }

    upstream twenty_server {
        server twenty-server:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. JobNest Backend API
        location /api/ {
            proxy_pass http://jobnest_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Twenty CRM Interface & API
        location /crm/ {
            proxy_pass http://twenty_server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # 3. JobNest Marketplace Frontend (Default Root)
        location / {
            proxy_pass http://jobnest_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            try_files $uri $uri/ /index.html;
        }
    }
}

