# ==============================================================================
# TWENTY CRM — PRODUCTION SELF-HOSTED DOCKER COMPOSE FOR JOBNEST
# Official Image: twentycrm/twenty (https://github.com/twentyhq/twenty)
# Decoupled Standalone Infrastructure — Does NOT share database with JobNest
# ==============================================================================

services:
  server:
    image: twentycrm/twenty:${TAG:-latest}
    container_name: twenty-server
    restart: unless-stopped
    ports:
      # Port 3020 on host maps to internal 3000 to prevent port collisions
      - "${PORT:-3020}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVER_URL=${SERVER_URL:-http://localhost:3020}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Vui lòng cấu hình ENCRYPTION_KEY trong .env}
      - PG_DATABASE_URL=postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD:?Vui lòng đặt PG_DATABASE_PASSWORD trong .env}@twenty-db:5432/${PG_DATABASE_NAME:-twenty}
      - REDIS_URL=redis://twenty-redis:6379
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/packages/twenty-server/.local-storage
      - APP_SECRET=${APP_SECRET:-}
      - DISABLE_SIGN_UP=${DISABLE_SIGN_UP:-false}
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    networks:
      - twenty-network

  worker:
    image: twentycrm/twenty:${TAG:-latest}
    container_name: twenty-worker
    command: ["yarn", "worker:prod"]
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SERVER_URL=${SERVER_URL:-http://localhost:3020}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Vui lòng cấu hình ENCRYPTION_KEY trong .env}
      - PG_DATABASE_URL=postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD:?Vui lòng đặt PG_DATABASE_PASSWORD trong .env}@twenty-db:5432/${PG_DATABASE_NAME:-twenty}
      - REDIS_URL=redis://twenty-redis:6379
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/packages/twenty-server/.local-storage
      - APP_SECRET=${APP_SECRET:-}
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    depends_on:
      server:
        condition: service_started
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    networks:
      - twenty-network

  twenty-db:
    image: twentycrm/twenty-postgres:${TAG:-latest}
    container_name: twenty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER:-twenty}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?Vui lòng cấu hình PG_DATABASE_PASSWORD trong .env}
      POSTGRES_DB: ${PG_DATABASE_NAME:-twenty}
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    ports:
      # Cổng 5435 trên Host để debug ngoài nếu cần (TRÁNH CỔNG 5432 CỦA JOBNEST)
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-twenty} -d ${PG_DATABASE_NAME:-twenty}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - twenty-network

  twenty-redis:
    image: redis:7-alpine
    container_name: twenty-redis
    restart: unless-stopped
    volumes:
      - twenty_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - twenty-network

volumes:
  twenty_server_data:
  twenty_docker_data:
  twenty_db_data:
  twenty_redis_data:

networks:
  twenty-network:
    name: twenty-network
    driver: bridge

