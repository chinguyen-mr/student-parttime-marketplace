<div style="font: 13px/1.5 Inter, system-ui, sans-serif; padding: 12px; color: #1e1b2e">
  <p style="margin: 0 0 8px">Chọn thư mục <b>05_wireframes/figma</b> (có 61 file .svg và prototype_links.json). Plugin sẽ xóa trang “JobNest Prototype” cũ và dựng lại từ đầu.</p>
  <input id="dir" type="file" webkitdirectory directory multiple />
  <button id="run" style="display: block; margin-top: 10px; padding: 6px 14px; background: #7565A8; color: #fff; border: 0; border-radius: 6px; cursor: pointer">Dựng prototype</button>
  <p id="msg" style="margin: 10px 0 0; white-space: pre-line"></p>
</div>
<script>
  const msg = (t) => { document.getElementById('msg').textContent = t; };
  document.getElementById('run').onclick = async () => {
    const files = [...document.getElementById('dir').files];
    const svgFiles = files.filter((f) => /\.svg$/i.test(f.name) && /^[GSEA]\d/.test(f.name));
    const linkFile = files.find((f) => f.name === 'prototype_links.json');
    if (!svgFiles.length || !linkFile) return msg('Chưa đúng thư mục: cần các file .svg (G01…, S01…) và prototype_links.json');
    msg(`Đang đọc ${svgFiles.length} file…`);
    const svgs = [];
    for (const f of svgFiles) svgs.push({ name: f.name.replace(/\.svg$/i, ''), text: await f.text() });
    const data = JSON.parse(await linkFile.text());
    document.getElementById('run').disabled = true;
    parent.postMessage({ pluginMessage: { type: 'build', svgs, data } }, '*');
  };
  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    msg(m.text);
    if (m.type === 'done') document.getElementById('run').disabled = false;
  };
</script>
